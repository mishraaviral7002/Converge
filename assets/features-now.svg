<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Available now: whiteboard, real-time collaboration, room-based boards, secure sign-in">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<style>

.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.march{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.ft{font:800 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.fd{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#9fb0c8}
.tg{font:600 9px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px}
.top{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ic{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
</style>
<g class="fu" style="animation-delay:0.00s"><rect x="1.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="top" x="19" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.30s"/><g class="ic" style="animation-delay:0.0s"><g transform="translate(19 32)"><rect x="1" y="3" width="26" height="20" rx="4" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><path d="M5 17 q4 -9 8 0 t8 0" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/></g></g><circle class="pulse" cx="151" cy="46" r="3" fill="#2dd4bf"/><text class="tg" x="193" y="49.5" text-anchor="end" fill="#2dd4bf">LIVE</text><text class="ft" x="19" y="100">Interactive whiteboard</text><text class="fd" x="19" y="126">A full canvas to sketch,</text><text class="fd" x="19" y="144">write, and arrange ideas,</text><text class="fd" x="19" y="162">built on tldraw.</text></g><g class="fu" style="animation-delay:0.12s"><rect x="225.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="top" x="243" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.42s"/><g class="ic" style="animation-delay:0.4s"><g transform="translate(243 32)"><circle cx="10" cy="9" r="4.5" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><circle cx="21" cy="11" r="3.5" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><path d="M2 25 a8 8 0 0 1 16 0 M16 25 a6 6 0 0 1 11 -1" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/></g></g><circle class="pulse" cx="375" cy="46" r="3" fill="#2dd4bf"/><text class="tg" x="417" y="49.5" text-anchor="end" fill="#2dd4bf">LIVE</text><text class="ft" x="243" y="100">Real-time collaboration</text><text class="fd" x="243" y="126">Everyone edits the same</text><text class="fd" x="243" y="144">board at once and sees</text><text class="fd" x="243" y="162">changes live.</text></g><g class="fu" style="animation-delay:0.24s"><rect x="449.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="top" x="467" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.54s"/><g class="ic" style="animation-delay:0.8s"><g transform="translate(467 32)"><path d="M5 26 V12 a9 9 0 0 1 18 0 V26 Z" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linejoin="round"/><circle cx="18" cy="18" r="1.6" fill="#2dd4bf"/></g></g><circle class="pulse" cx="599" cy="46" r="3" fill="#2dd4bf"/><text class="tg" x="641" y="49.5" text-anchor="end" fill="#2dd4bf">LIVE</text><text class="ft" x="467" y="100">Room-based boards</text><text class="fd" x="467" y="126">A board ID is a room.</text><text class="fd" x="467" y="144">Share it and collaborators</text><text class="fd" x="467" y="162">join the same space.</text></g><g class="fu" style="animation-delay:0.36s"><rect x="673.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#1f2a3d"/><rect class="top" x="691" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.66s"/><g class="ic" style="animation-delay:1.2s"><g transform="translate(691 32)"><rect x="4" y="12" width="20" height="14" rx="3.5" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><path d="M8 12 V9 a6 6 0 0 1 12 0 V12" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/></g></g><circle class="pulse" cx="823" cy="46" r="3" fill="#2dd4bf"/><text class="tg" x="865" y="49.5" text-anchor="end" fill="#2dd4bf">LIVE</text><text class="ft" x="691" y="100">Secure sign-in</text><text class="fd" x="691" y="126">Cookie-based sessions so</text><text class="fd" x="691" y="144">only signed-in users can</text><text class="fd" x="691" y="162">join a board.</text></g>
</svg>
