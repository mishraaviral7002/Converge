<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Planned: AI brainstorming, intelligent planning, visual mind mapping, shared workspaces">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<style>

.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.march{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.ft{font:800 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.fd{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#9fb0c8}
.tg{font:600 9px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px}
.top{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ic{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
</style>
<g class="fu" style="animation-delay:0.00s"><rect class="march" x="1.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#f59e0b" stroke-opacity=".7" stroke-dasharray="4 5"/><rect class="top" x="19" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.30s"/><g class="ic" style="animation-delay:0.0s"><g transform="translate(19 32)"><path d="M14 1 L17 11 L27 14 L17 17 L14 27 L11 17 L1 14 L11 11 Z" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/></g></g><circle class="pulse" cx="151" cy="46" r="3" fill="#f59e0b"/><text class="tg" x="193" y="49.5" text-anchor="end" fill="#f59e0b">PLANNED</text><text class="ft" x="19" y="100">AI brainstorming</text><text class="fd" x="19" y="126">Generate ideas, summarise</text><text class="fd" x="19" y="144">discussions, and explore</text><text class="fd" x="19" y="162">possible solutions.</text></g><g class="fu" style="animation-delay:0.12s"><rect class="march" x="225.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#f59e0b" stroke-opacity=".7" stroke-dasharray="4 5"/><rect class="top" x="243" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.42s"/><g class="ic" style="animation-delay:0.4s"><g transform="translate(243 32)"><path d="M2 7 l3 3 l5 -6 M2 18 l3 3 l5 -6" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8 H27 M15 19 H27" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/></g></g><circle class="pulse" cx="375" cy="46" r="3" fill="#f59e0b"/><text class="tg" x="417" y="49.5" text-anchor="end" fill="#f59e0b">PLANNED</text><text class="ft" x="243" y="100">Intelligent planning</text><text class="fd" x="243" y="126">Turn ideas into plans,</text><text class="fd" x="243" y="144">tasks, and workflows</text><text class="fd" x="243" y="162">automatically.</text></g><g class="fu" style="animation-delay:0.24s"><rect class="march" x="449.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#f59e0b" stroke-opacity=".7" stroke-dasharray="4 5"/><rect class="top" x="467" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.54s"/><g class="ic" style="animation-delay:0.8s"><g transform="translate(467 32)"><circle cx="14" cy="14" r="4" fill="none" stroke="#f59e0b" stroke-width="1.8"/><circle cx="4" cy="5" r="2.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/><circle cx="24" cy="6" r="2.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/><circle cx="14" cy="25" r="2.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/><path d="M6 7 L11 11 M22 8 L17 11 M14 18 V22.5" stroke="#f59e0b" stroke-width="1.6"/></g></g><circle class="pulse" cx="599" cy="46" r="3" fill="#f59e0b"/><text class="tg" x="641" y="49.5" text-anchor="end" fill="#f59e0b">PLANNED</text><text class="ft" x="467" y="100">Visual mind mapping</text><text class="fd" x="467" y="126">Connect related concepts</text><text class="fd" x="467" y="144">and make relationships</text><text class="fd" x="467" y="162">between ideas visible.</text></g><g class="fu" style="animation-delay:0.36s"><rect class="march" x="673.5" y="10.5" width="207" height="168" rx="14" fill="#0e1524" stroke="#f59e0b" stroke-opacity=".7" stroke-dasharray="4 5"/><rect class="top" x="691" y="11" width="56" height="3" rx="1.5" fill="url(#g)" style="animation-delay:0.66s"/><g class="ic" style="animation-delay:1.2s"><g transform="translate(691 32)"><rect x="2" y="2" width="10" height="10" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="16" y="2" width="10" height="10" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="2" y="16" width="10" height="10" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.8"/><rect x="16" y="16" width="10" height="10" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.8"/></g></g><circle class="pulse" cx="823" cy="46" r="3" fill="#f59e0b"/><text class="tg" x="865" y="49.5" text-anchor="end" fill="#f59e0b">PLANNED</text><text class="ft" x="691" y="100">Shared workspaces</text><text class="fd" x="691" y="126">Organise boards around</text><text class="fd" x="691" y="144">teams, projects, and</text><text class="fd" x="691" y="162">goals.</text></g>
</svg>
