<text x="48" y="208" style="font:400 15.5px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#5B6785">A shared whiteboard for teams. Open a board,</text>
<text x="48" y="230" style="font:400 15.5px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#5B6785">share its ID, and everyone who joins edits</text>
<text x="48" y="252" style="font:400 15.5px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#5B6785">the same canvas, live.</text>

