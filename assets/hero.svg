<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Converge: an AI-powered collaborative whiteboard. Think together. Build smarter.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1018"/><stop offset="1" stop-color="#121a2c"/></linearGradient>
  <linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".08"/></pattern>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b7cff" stop-opacity=".25"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="520" y="36" width="356" height="268" rx="14"/></clipPath>
  <clipPath id="ty"><rect x="48" y="150" width="0" height="36"><animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0600;0.0700;0.0800;0.0900;0.1000;0.1100;0.1200;0.1300;0.1400;0.1500;0.1600;0.1700;0.1800;0.1900;0.2000;0.2100;0.2200;0.2300;0.2400;0.2500;0.2600;0.2700;0.2800;0.2900;0.3000;0.3100;0.3200;0.3300;0.3400;0.3500;0.8500;1.0000" values="0;12.6;25.2;37.8;50.4;63.0;75.6;88.2;100.8;113.4;126.0;138.6;151.2;163.8;176.4;189.0;201.6;214.2;226.8;239.4;252.0;264.6;277.2;289.8;302.4;315.0;327.6;340.2;352.8;365.4;378.0;0;0"/></rect></clipPath>
</defs>
<style>

.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.march{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.lab{font:600 12px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px;fill:#f59e0b}
.ttl{font:800 66px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:-2px;fill:url(#tt)}
.tag{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.chip{font:600 12.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.mono{font:500 12px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8}
.nt{font:800 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.aura{animation:aura 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes aura{50%{transform:scale(1.15);opacity:.7}}
</style>

<rect width="900" height="340" rx="18" fill="url(#bg)"/>
<rect width="900" height="340" rx="18" fill="url(#dots)"/>
<circle class="aura" cx="700" cy="170" r="210" fill="url(#aura)"/>

<!-- left column -->
<g class="fu" style="animation-delay:.1s"><circle class="pulse" cx="52" cy="56" r="4" fill="#f59e0b"/><text class="lab" x="64" y="60">AI-POWERED COLLABORATIVE WHITEBOARD</text></g>
<text class="ttl fu" x="44" y="132" style="animation-delay:.25s">Converge</text>
<g class="fu" style="animation-delay:.45s"><text class="tag" x="48" y="176" textLength="378" lengthAdjust="spacing" clip-path="url(#ty)">Think together. Build smarter.</text><g class="blink"><rect y="155" width="3" height="26" fill="#2dd4bf" x="48"><animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0600;0.0700;0.0800;0.0900;0.1000;0.1100;0.1200;0.1300;0.1400;0.1500;0.1600;0.1700;0.1800;0.1900;0.2000;0.2100;0.2200;0.2300;0.2400;0.2500;0.2600;0.2700;0.2800;0.2900;0.3000;0.3100;0.3200;0.3300;0.3400;0.3500;0.8500;1.0000" values="48;60.6;73.2;85.8;98.4;111.0;123.6;136.2;148.8;161.4;174.0;186.6;199.2;211.8;224.4;237.0;249.6;262.2;274.8;287.4;300.0;312.6;325.2;337.8;350.4;363.0;375.6;388.2;400.8;413.4;426.0;48;48"/></rect></g></g>
<g class="fu" style="animation-delay:0.75s"><rect x="48.5" y="204.5" width="133" height="26" rx="13" fill="#161f33" stroke="#1f2a3d"/><circle cx="62" cy="217.5" r="3" fill="#2dd4bf"/><text class="chip" x="72" y="222">Real-time sync</text></g><g class="fu" style="animation-delay:0.87s"><rect x="191.5" y="204.5" width="126" height="26" rx="13" fill="#161f33" stroke="#1f2a3d"/><circle cx="205" cy="217.5" r="3" fill="#2dd4bf"/><text class="chip" x="215" y="222">tldraw canvas</text></g><g class="fu" style="animation-delay:0.99s"><rect x="327.5" y="204.5" width="111" height="26" rx="13" fill="#161f33" stroke="#1f2a3d"/><circle cx="341" cy="217.5" r="3" fill="#2dd4bf"/><text class="chip" x="351" y="222">AI planning</text></g>
<g class="fu" style="animation-delay:1.1s">
  <circle cx="58" cy="268" r="11" fill="#8b7cff" stroke="#0b1018" stroke-width="2"/>
  <circle cx="76" cy="268" r="11" fill="#2dd4bf" stroke="#0b1018" stroke-width="2"/>
  <circle cx="94" cy="268" r="11" fill="#f472b6" stroke="#0b1018" stroke-width="2"/>
  <circle class="pulse" cx="120" cy="268" r="4" fill="#22c55e"/>
  <text class="mono" x="132" y="272">3 collaborators in this room</text>
</g>
<g class="fu" style="animation-delay:1.25s">
  <rect x="48.5" y="288.5" width="190" height="24" rx="12" fill="#161f33" stroke="#f59e0b" stroke-opacity=".6"/>
  <circle class="pulse" cx="64" cy="300.5" r="3.5" fill="#f59e0b"/>
  <text class="mono" x="76" y="304" style="font-size:11px;fill:#f59e0b">IN ACTIVE DEVELOPMENT</text>
</g>

<!-- whiteboard window -->
<g class="fu" style="animation-delay:.5s">
  <rect x="520.5" y="36.5" width="355" height="267" rx="14" fill="#0e1524" stroke="#1f2a3d"/>
  <rect x="521" y="37" width="354" height="34" fill="#0c1220" clip-path="url(#win)"/>
  <circle cx="540" cy="54" r="4" fill="#ef4444"/><circle cx="555" cy="54" r="4" fill="#f59e0b"/><circle cx="570" cy="54" r="4" fill="#22c55e"/>
  <text class="mono" x="590" y="58" style="font-size:11px">board / converge-room</text>
  <circle cx="824" cy="54" r="7" fill="#8b7cff" stroke="#0c1220" stroke-width="2"/>
  <circle cx="840" cy="54" r="7" fill="#2dd4bf" stroke="#0c1220" stroke-width="2"/>
  <circle cx="856" cy="54" r="7" fill="#f472b6" stroke="#0c1220" stroke-width="2"/>
</g>

<g clip-path="url(#win)">
  <!-- sticky notes -->
  <g class="pop" style="animation-delay:.9s"><rect x="546" y="96" width="100" height="64" rx="8" fill="#241d4d" stroke="#8b7cff"/><text class="nt" x="560" y="120">Ideas</text><rect x="560" y="130" width="64" height="4" rx="2" fill="#9fb0c8" opacity=".5"/><rect x="560" y="140" width="44" height="4" rx="2" fill="#9fb0c8" opacity=".35"/></g>
  <g class="pop" style="animation-delay:1.1s"><rect x="730" y="112" width="100" height="64" rx="8" fill="#0f2f2e" stroke="#2dd4bf"/><text class="nt" x="744" y="136">Plan</text><rect x="744" y="146" width="64" height="4" rx="2" fill="#9fb0c8" opacity=".5"/><rect x="744" y="156" width="44" height="4" rx="2" fill="#9fb0c8" opacity=".35"/></g>
  <g class="pop" style="animation-delay:1.3s"><rect x="640" y="214" width="100" height="56" rx="8" fill="#3a2a0c" stroke="#f59e0b"/><text class="nt" x="654" y="238">Tasks</text><rect x="654" y="248" width="64" height="4" rx="2" fill="#9fb0c8" opacity=".5"/></g>

  <!-- connectors drawn live by collaborators -->
  <path d="M646 128 C 680 118, 700 150, 730 144" fill="none" stroke="#8b7cff" stroke-width="2.4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.15;.4;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0" keyTimes="0;.92;1"/>
  </path>
  <path d="M780 176 C 790 214, 770 240, 740 242" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.45;.7;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0" keyTimes="0;.92;1"/>
  </path>

  <!-- AI assistant (planned) -->
  <line class="march" x1="598" y1="250" x2="640" y2="244" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 5"/>
  <circle class="ring" cx="580" cy="252" r="17" fill="none" stroke="#f59e0b"/>
  <circle cx="580" cy="252" r="17" fill="#1c1330" stroke="#f59e0b" stroke-dasharray="3 3"/>
  <text x="580" y="256" text-anchor="middle" style="font:800 11px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#f59e0b">AI</text>
  <text x="580" y="284" text-anchor="middle" style="font:500 9px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8">assistant · planned</text>

  <!-- live cursors -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.15;.4;1" path="M646 128 C 680 118, 700 150, 730 144"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.92;1"/>
    <path d="M0 0 L0 16 L4.5 12 L8 19 L10.5 18 L7 11 L13 11 Z" fill="#8b7cff" stroke="#0b1018" stroke-width="1"/>
    <rect x="12" y="16" width="38" height="18" rx="9" fill="#8b7cff"/><text x="31" y="28.5" text-anchor="middle" style="font:700 10px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#0b1018">Aria</text>
  </g>
  <g>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.45;.7;1" path="M780 176 C 790 214, 770 240, 740 242"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.92;1"/>
    <path d="M0 0 L0 16 L4.5 12 L8 19 L10.5 18 L7 11 L13 11 Z" fill="#2dd4bf" stroke="#0b1018" stroke-width="1"/>
    <rect x="12" y="16" width="34" height="18" rx="9" fill="#2dd4bf"/><text x="29" y="28.5" text-anchor="middle" style="font:700 10px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#0b1018">Sam</text>
  </g>
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M690 88 C 720 74, 770 80, 780 98 C 790 118, 700 112, 690 88 Z"/>
    <path d="M0 0 L0 16 L4.5 12 L8 19 L10.5 18 L7 11 L13 11 Z" fill="#f472b6" stroke="#0b1018" stroke-width="1"/>
    <rect x="12" y="16" width="30" height="18" rx="9" fill="#f472b6"/><text x="27" y="28.5" text-anchor="middle" style="font:700 10px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#0b1018">Kai</text>
  </g>
</g>
</svg>
