<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="Getting started">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<style>

.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.march{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.n{font:600 13px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#f59e0b;letter-spacing:2px}
.t{font:800 24px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf7}
.s{font:500 13px 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9fb0c8}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sh{animation:sh 4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-80px);opacity:0}20%{opacity:.9}60%,100%{transform:translateX(880px);opacity:0}}
</style>
<rect x=".5" y=".5" width="899" height="55" rx="12" fill="#0b1018" stroke="#1f2a3d"/>
<circle class="pulse" cx="26" cy="28" r="4" fill="#f59e0b"/>
<text class="n" x="42" y="33">06</text>
<text class="t" x="96" y="36">Getting started</text>
<text class="s" x="874" y="33" text-anchor="end">setup</text>
<rect class="bar" x="14" y="51" width="872" height="3" rx="1.5" fill="url(#g)"/>
<rect class="sh" x="14" y="51" width="60" height="3" rx="1.5" fill="#ffffff" fill-opacity=".7"/>
</svg>
